name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive
  LLAM_VERSION: "2.0.0"
  LLAM_BASE_URL: "https://github.com/Feralthedogg/LLAM/releases/download/v2.0.0"

jobs:
  local-tests:
    name: Local build, tests, and audits
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            liburing-dev \
            pkg-config \
            python3

      - name: Install LLAM
        env:
          LLAM_PREFIX: ${{ github.workspace }}/.llam
        run: |
          curl -fsSL "${LLAM_BASE_URL}/install.sh" | sh -s -- \
            --version "${LLAM_VERSION}" \
            --base-url "${LLAM_BASE_URL}" \
            --prefix "${LLAM_PREFIX}"

      - name: Configure
        env:
          LLAM_PREFIX: ${{ github.workspace }}/.llam
        run: |
          cmake -S . -B build-test \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DCMAKE_PREFIX_PATH="${LLAM_PREFIX}"

      - name: Build
        run: cmake --build build-test --parallel 2

      - name: Run CTest
        run: ctest --test-dir build-test --output-on-failure

      - name: Run audits
        run: |
          python3 tools/run_power_of_ten_audit.py
          python3 tools/run_llps_completion_audit.py

  docker-smoke:
    name: Dockerfile smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: local-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker version
        run: docker version

      - name: Run Docker smoke test
        run: |
          python3 tools/run_docker_prod_check.py \
            --protocol-gate \
            --synthetic-readiness \
            --audit-mac \
            --timeout 180 \
            --chat-timeout 10 \
            --log-tail 120

      - name: Upload LLPS logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llps-ci-logs
          path: |
            logs/*.pxf
            logs/*.log
            logs/*.yml
          if-no-files-found: ignore

      - name: Cleanup Docker resources
        if: always()
        run: |
          docker ps -aq --filter "name=llps-" | xargs -r docker rm -f
          docker network ls --format '{{.Name}}' | grep '^llps-' | xargs -r docker network rm
